name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install Capacitor
        working-directory: android
        run: npm install

      - name: Add Android platform & sync web assets
        working-directory: android
        run: |
          npx cap add android
          npx cap sync

      - name: Build debug APK
        working-directory: android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publish APK to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: android
          allowUpdates: true
          name: 拼豆豆仓安卓 App
          body: 自动构建的可安装 APK（需 Android 5.1+，安装时允许「未知来源」）。
          artifacts: android/android/app/build/outputs/apk/debug/app-debug.apk
          token: ${{ secrets.GITHUB_TOKEN }}
