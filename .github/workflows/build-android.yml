name: Build Android APK

on:
  push:
    branches: [master]
    paths-ignore:
      - 'downloads/**'
      - 'desktop-launcher/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install npm dependencies
        run: |
          npm install 2>&1
          echo "npm install exit code: $?"

      - name: Add Android platform (Capacitor)
        run: |
          npx cap add android 2>&1 || echo "cap add failed or platform exists"
          echo "cap add exit code: $?"
          ls -la android/ 2>/dev/null || echo "android/ dir not found"

      - name: Sync web assets to Android
        run: |
          npx cap sync android 2>&1
          echo "cap sync exit code: $?"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug 2>&1

      - name: Publish APK to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: android
          allowUpdates: true
          name: 拼豆豆仓安卓 App
          body: 自动构建的可安装 APK（需 Android 5.1+，安装时允许「未知来源」）。
          artifacts: android/app/build/outputs/apk/debug/app-debug.apk
          token: ${{ secrets.GITHUB_TOKEN }}
