name: Build Android APK

on:
  push:
    branches: [master]
    paths-ignore:
      - 'downloads/**'
      - 'desktop-launcher/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install npm dependencies
        run: |
          npm install 2>&1
          echo "npm install exit code: $?"

      - name: Add Android platform (Capacitor)
        run: |
          npx cap add android 2>&1 || echo "cap add failed or platform exists"
          echo "cap add exit code: $?"
          ls -la android/ 2>/dev/null || echo "android/ dir not found"

      - name: Sync web assets to Android
        run: |
          npx cap sync android 2>&1
          echo "cap sync exit code: $?"

      - name: Apply website favicon as app icon + app name
        run: |
          echo "== 用网站 favicon 覆盖默认 Capacitor 图标 =="
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp -v assets/android-icons/mipmap-$d/ic_launcher.png android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp -v assets/android-icons/mipmap-$d/ic_launcher_round.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
          done
          # 移除默认自适应图标(anydpi-v26)，避免回退到 Capacitor 自带背景/前景
          rm -rf android/app/src/main/res/mipmap-anydpi-v26 || true
          # 确保应用名为「拼豆豆仓」
          sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">拼豆豆仓</string>|' android/app/src/main/res/values/strings.xml
          grep -n "app_name" android/app/src/main/res/values/strings.xml
          echo "icon + name applied"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug 2>&1

      - name: Publish APK to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: android
          allowUpdates: true
          name: 拼豆豆仓安卓 App
          body: 拼豆豆仓官方安卓安装包（需 Android 5.1+，安装时允许「未知来源」）。下载后直接安装，桌面即出现「拼豆豆仓」图标，点开即用。
          artifacts: android/app/build/outputs/apk/debug/app-debug.apk:pindoucang-android.apk
          token: ${{ secrets.GITHUB_TOKEN }}
