<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>拼豆豆仓 · 拼豆库存管理</title>
  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- Tailwind Play CDN：无需构建，直接生效。注：需要联网加载；离线时为降级样式 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SheetJS：用于真正的 .xlsx 导入导出；离线时自动降级为 CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- 手写感字体（联网时生效，离线优雅降级到系统字体） -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />

  <script>
    // 马卡龙柔和主题：扩展 Tailwind 颜色与字体
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mk: {
              pink:  '#FBD3E9',
              rose:  '#F8BBD0',
              mint:  '#C8F0E0',
              sky:   '#CDE7FB',
              lemon: '#FFF3C4',
              peach: '#FFD9C0',
              lav:   '#E3D4F7',
              cream: '#FFF9F2',
              sand:  '#F3E9DD',
              brown: '#E9DAC9',
              ink:   '#5B5147',
              sub:   '#8A7E70'
            }
          },
          fontFamily: {
            sans: ['"Baloo 2"', '"Nunito"', 'system-ui', 'sans-serif']
          },
          boxShadow: {
            soft: '0 8px 24px -10px rgba(150,120,100,0.35)'
          },
          borderRadius: { '2xl': '1.25rem' }
        }
      }
    }
  </script>

  <style>
    /* 少量自定义：滚动条、卡片质感、画布背景网格（手作风底色） */
    /* overscroll-behavior-x: none 阻止横向 overscroll 触发安卓 Chrome 的返回手势 */
    html, body { overscroll-behavior-x: none; }
    body { background:
        radial-gradient(circle at 12% 18%, #FBD3E9 0%, transparent 38%),
        radial-gradient(circle at 88% 12%, #CDE7FB 0%, transparent 40%),
        radial-gradient(circle at 75% 88%, #C8F0E0 0%, transparent 42%),
        #FFF9F2; }
    .mk-card { background: rgba(255,255,255,0.78); backdrop-filter: blur(6px); }
    ::-webkit-scrollbar { height: 8px; width: 8px; }
    ::-webkit-scrollbar-thumb { background: #E9DAC9; border-radius: 999px; }
    .nav-btn.active { background: #fff; color: #5B5147; box-shadow: 0 4px 14px -8px rgba(150,120,100,.5); }
    .swatch { box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
    input, select, textarea { outline: none; }
    input:focus, select:focus, textarea:focus { border-color:#F8BBD0 !important; box-shadow:0 0 0 3px rgba(248,187,208,.35); }
    /* 页面左右滑动切换动画 */
    /* 滑动翻页动画：仅做轻微位移滑入，不使用 opacity:0 —— 避免动画类万一残留导致整页空白 */
    #view { transition: transform .28s cubic-bezier(.22,.61,.36,1); will-change: transform; }
    #view.view-from-right { transform: translateX(40px); }
    #view.view-from-left  { transform: translateX(-40px); }
  </style>
</head>

<body class="font-sans text-mk-ink min-h-screen">
  <!-- 顶部品牌 + 导航 -->
  <header class="sticky top-0 z-30 bg-white/70 backdrop-blur border-b border-mk-sand">
    <div class="max-w-6xl mx-auto px-4 py-2 sm:py-3">
      <div class="flex items-center justify-between gap-3">
        <div id="brand" class="flex items-center gap-2 shrink-0 cursor-pointer hover:opacity-80 transition select-none" title="回到首页">
          <img src="favicon.png" alt="拼豆豆仓" class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-white object-cover shadow-soft" />
          <div>
            <div class="font-bold text-base sm:text-lg leading-none">拼豆豆仓</div>
            <div class="hidden sm:block text-[11px] text-mk-sub">手作拼豆库存 · 图纸识别 · 配方库</div>
          </div>
        </div>
        <div id="header-user" class="shrink-0"></div>
      </div>
      <nav id="nav" class="flex gap-1 sm:gap-1.5 w-full mt-2 sm:mt-3"></nav>
    </div>
  </header>

  <!-- 主视图容器：各页面渲染到此 -->
  <main class="max-w-6xl mx-auto px-4 py-6">
    <div id="view"></div>
  </main>

  <!-- 模态框根节点 -->
  <div id="modal-root"></div>
  <!-- 轻提示根节点 (放顶部以避免多行提示被底部截断) -->
  <div id="toast-root" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 items-center pointer-events-none max-h-[80vh] overflow-y-auto"></div>

  <!-- Supabase JS（用于云端同步；未配置时应用自动降级为 localStorage） -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 本地 Supabase 配置（含项目 URL / anon key 占位，部署前填写） -->
  <!-- cache-bust: 改 app.js/config.js 后必须 bump 此版本号，否则 Cloudflare/浏览器会一直返回缓存的旧版 -->
  <script src="config.js?v=20260819f"></script>
  <!-- 二维码生成（首页「下载 App」用）：联网时生效，离线优雅降级为文字链接 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="app.js?v=20260819f"></script>
</body>
</html>
